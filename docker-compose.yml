# Development database: PostgreSQL 16 with pgvector, for the `chat` schema.
#
#   docker compose up -d
#
# In production the `chat` schema lives in basedb's database (D1), so that basedb's SQL views
# can read it for its dashboards. Published on 127.0.0.1 only.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - chat-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  chat-postgres:

# Development: PostgreSQL 16 with pgvector, and the chat's own basedb.
#
#   corepack pnpm db:up            # writes .env on first run, then `docker compose up -d`
#   corepack pnpm basedb:setup     # creates the « Messagerie » base and links the chat to it
#
# The `chat` schema lives in the `chat` database; basedb keeps its catalog and its bases in
# the `basedb` database of the same server. (In production the `chat` schema lives in
# basedb's database, so that basedb's SQL views can read it for its dashboards — D1.)
# Everything is published on 127.0.0.1 only.
#
# The secrets — basedb's encryption key, its administrator's password — are in `.env`,
# generated by `scripts/dev-env.mjs`, never in this file.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - chat-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates basedb's database once, beside the chat's: an existing volume never runs the
  # image's initialisation scripts again.
  basedb-database:
    image: pgvector/pgvector:pg16
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGPASSWORD: chat
    entrypoint:
      - sh
      - -c
      - >-
        psql -h postgres -U chat -d chat -tAc "SELECT 1 FROM pg_database WHERE datname = 'basedb'" | grep -q 1
        || psql -h postgres -U chat -d chat -c "CREATE DATABASE basedb"
    restart: "no"

  # basedb, as its image ships: the interface, the API under /api and /auth, MCP under /mcp.
  basedb:
    image: eodia/basedb:${BASEDB_VERSION:-0.5.0}
    restart: unless-stopped
    init: true
    depends_on:
      basedb-database: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://chat:chat@postgres:5432/basedb
      BASEDB_ENCRYPTION_KEY: ${BASEDB_ENCRYPTION_KEY:?run corepack pnpm db:up, which writes .env}
      BASEDB_TENANT: ${BASEDB_TENANT:-t4z56fq}
      BASEDB_MIGRATE: "1"
      BASEDB_BOOTSTRAP: "1"
      BASEDB_ADMIN_EMAIL: ${BASEDB_ADMIN_EMAIL:-}
      BASEDB_ADMIN_PASSWORD: ${BASEDB_ADMIN_PASSWORD:-}
      BASEDB_PUBLIC_URL: http://localhost:${BASEDB_PORT:-8890}
      # The inbox asks basedb for the agent's token from its own origin (D4).
      BASEDB_ORIGINS: ${CHAT_WEB_ORIGIN:-http://localhost:3210}
      BASEDB_TEMPLATES_URL: "off"
    volumes:
      - basedb-files:/data
    ports:
      - "127.0.0.1:${BASEDB_PORT:-8890}:3000"

volumes:
  chat-postgres:
  basedb-files:

# Development: PostgreSQL 16 with pgvector — the chat's one database (D19) — and Mailpit,
# which catches the e-mails the chat writes (D23): CHAT_SMTP_URL=smtp://127.0.0.1:1025,
# read them at http://localhost:8025.
#
#   corepack pnpm db:up            # `docker compose up -d`
#
# Published on 127.0.0.1 only.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "127.0.0.1:55440:5432"
    volumes:
      - chat-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d chat"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  chat-postgres:

name: Publier l’image Docker

# The messaging image — the server and the inbox in one — on Docker Hub,
# eodia/messagerie: a `v0.1.0` tag publishes 0.1.0, 0.1 and latest; a prerelease
# (`v0.2.0-rc.1`) publishes its exact version only. For amd64 and arm64 (emulated).
# The site has its own tags, `www-v*` (deploy-www.yml).
on:
  push:
    tags:
      - 'v*'
  # By hand, from a `v*` tag: publishes that version again.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et publier
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Lancez ce workflow depuis une étiquette vX.Y.Z (reçu : $GITHUB_REF_NAME)."
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          tags=(--tag "eodia/messagerie:$version")
          if [[ -z "${BASH_REMATCH[4]}" ]]; then
            tags+=(--tag "eodia/messagerie:${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" --tag eodia/messagerie:latest)
          fi

          docker buildx build . \
            --platform linux/amd64,linux/arm64 \
            "${tags[@]}" \
            --label "org.opencontainers.image.title=messagerie" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-or-later" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --push
